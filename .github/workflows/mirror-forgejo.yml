name: Mirror Forgejo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-forgejo-main
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main to git.miles.systems
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Forgejo SSH key
        env:
          FORGEJO_MIRROR_SSH_KEY: ${{ secrets.FORGEJO_MIRROR_SSH_KEY }}
        run: |
          test -n "$FORGEJO_MIRROR_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$FORGEJO_MIRROR_SSH_KEY" > ~/.ssh/forgejo_mirror
          chmod 600 ~/.ssh/forgejo_mirror
          ssh-keyscan -H git.miles.systems >> ~/.ssh/known_hosts

      - name: Push main and tags to Forgejo
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/forgejo_mirror -o IdentitiesOnly=yes
        run: |
          git remote add forgejo git@git.miles.systems:CarbonORM/CarbonC.git
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          git push forgejo refs/remotes/origin/main:refs/heads/main --tags
