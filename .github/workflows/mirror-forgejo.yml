name: Mirror Forgejo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-forgejo-main
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main to git.miles.systems
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Forgejo mirror token
        env:
          FORGEJO_MIRROR_TOKEN: ${{ secrets.FORGEJO_MIRROR_TOKEN }}
        run: |
          test -n "$FORGEJO_MIRROR_TOKEN"

      - name: Push main and tags to Forgejo
        env:
          FORGEJO_MIRROR_TOKEN: ${{ secrets.FORGEJO_MIRROR_TOKEN }}
        run: |
          git remote add forgejo "https://richardtmiles:${FORGEJO_MIRROR_TOKEN}@git.miles.systems/CarbonORM/CarbonC.git"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          git push forgejo refs/remotes/origin/main:refs/heads/main --tags
